name: CI Pipeline

# When should this run?
on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      # Step 1: Get the code
      - name: Checkout code
        uses: actions/checkout@v3
      
      # Step 2: Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '24'
      
      # Step 3: Setup pnpm
      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 10
      
      # Step 4: Install dependencies
      - name: Install dependencies
        run: pnpm install
      
      # Step 5: Run tests
      - name: Run tests
        run: pnpm test